# Reference copy. Canonical location: yt/.github/workflows/answer-tests.yml
name: answer-tests

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to test (its current head SHA)"
        required: false
      ref:
        description: "Any ref or SHA to test (ignored if pr is set; blank = the ref this was dispatched from)"
        required: false
      groups:
        description: "Comma-separated answer-test group keys from tests/tests.yaml (blank = all)"
        required: false

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  authorize:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/run-answer-tests'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      groups: ${{ steps.pin.outputs.groups }}
    steps:
      - name: Check commenter has write access
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          USER: ${{ github.event.comment.user.login }}
        run: |
          perm=$(gh api "repos/${{ github.repository }}/collaborators/${USER}/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write) echo "${USER}: ${perm}" ;;
            *) echo "::error::${USER} has '${perm}' permission; need write or above"; exit 1 ;;
          esac

      - name: Pin the SHA to test
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || inputs.pr }}
          REF: ${{ inputs.ref }}
          ANSWER_GROUPS: ${{ inputs.groups }}
        run: |
          if [ -n "$PR" ]; then
            sha=$(gh api "repos/${{ github.repository }}/pulls/${PR}" --jq .head.sha)
          elif [ -n "$REF" ]; then
            sha=$(gh api "repos/${{ github.repository }}/commits/${REF}" --jq .sha)
          else
            sha="${{ github.sha }}"
          fi
          echo "testing ${sha} (pr='${PR}' ref='${REF}' groups='${ANSWER_GROUPS}')"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "groups=${ANSWER_GROUPS}" >> "$GITHUB_OUTPUT"

      - name: Acknowledge the comment
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions"
          -f content=rocket

  answer-tests:
    needs: authorize
    runs-on: [self-hosted, jetstream]
    timeout-minutes: 240
    env:
      # Answer stores on the worker are py310_* prefixed; bump here and regenerate them
      # together (see yt-ci-infra docs/operations.md, "Bumping the Python version").
      PYTHON_VERSION: "3.10"
      MPLCONFIGDIR: tests
    steps:
      - name: Mark pending on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api "repos/${{ github.repository }}/statuses/${{ needs.authorize.outputs.sha }}"
          -f state=pending -f context=answer-tests
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          submodules: true
          persist-credentials: false

      - name: Install dependencies and yt
        shell: bash
        env:
          sync_args: --extra=full --group=nosetest
          UV_PYTHON: ${{ env.PYTHON_VERSION }}
          YT_CI_SKIP_SYSTEM_DEPS: "1"   # libfuse2 is provisioned on the worker; runner has no sudo
        run: source ./tests/ci_install.sh

      - name: Patch nosetest
        # same as build-test.yaml: nose is unmaintained and still references collections.Callable
        run: |
          find .venv/lib/python${PYTHON_VERSION}/site-packages/nose -name '*.py' \
            -exec sed -i -e 's/collections.Callable/collections.abc.Callable/g' '{}' ';'

      # YT_TEST_DATA_DIR (the dataset mount) and uv's PATH entry come from the worker's runner
      # .env/.path files, written by boot-runner.sh from /etc/yt-runner/env. Nothing here knows
      # where the data lives; the config-set line fails loudly on a runner that is not ours.
      - name: Run answer tests
        env:
          YT_TEST_GROUPS: ${{ needs.authorize.outputs.groups }}
        run: |
          uv run --no-sync yt config set --local yt test_data_dir "${YT_TEST_DATA_DIR:?not exported by the runner}"
          rm -f ./*.xml
          export NUM_WORKERS=$(( $(nproc) > 2 ? $(nproc) - 2 : 1 ))
          echo "NUM_WORKERS=$NUM_WORKERS groups='${YT_TEST_GROUPS}'"
          uv run --no-sync python tests/nose_runner.py

      - name: Upload xunit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: answer-tests-xunit-${{ needs.authorize.outputs.sha }}
          path: "*.xml"
          if-no-files-found: warn

      - name: Report status on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api "repos/${{ github.repository }}/statuses/${{ needs.authorize.outputs.sha }}"
          -f state=${{ job.status == 'success' && 'success' || 'failure' }}
          -f context=answer-tests
          -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
